<script>
const data = {
  engine: {
    title: "Engine Assembly",
    category: "POWERTRAIN",
    description: "Converts fuel energy into mechanical rotation. The Twin Spark engine uses two spark plugs.",
    inspect: "Check oil level, oil leaks, unusual noises and service history.",
    connected: "Spark plugs, ignition system, fuel system, air filter and exhaust."
  },
  tank: {
    title: "Fuel Tank",
    category: "FUEL SYSTEM",
    description: "Stores petrol and supplies fuel to the engine.",
    inspect: "Check for visible fuel leaks and damaged hoses. Never start the motorcycle if fuel is leaking.",
    connected: "Fuel cap, fuel lines and fuel delivery system."
  },
  front: {
    title: "Front Wheel and Brake",
    category: "BRAKING SYSTEM",
    description: "The front brake provides a major share of the motorcycle's stopping force.",
    inspect: "Check brake operation, tyre condition and visible damage.",
    connected: "Brake lever, brake line, brake assembly, wheel and tyre."
  },
  rear: {
    title: "Rear Wheel and Brake",
    category: "BRAKING SYSTEM",
    description: "Provides rear-wheel braking and transfers drive to the road.",
    inspect: "Check brake operation, tyre condition and visible damage.",
    connected: "Brake pedal, rear brake assembly, wheel and drive sprocket."
  },
  suspension: {
    title: "Suspension System",
    category: "CHASSIS",
    description: "Absorbs road irregularities and helps maintain tyre contact.",
    inspect: "Look for leaks, damaged components and excessive bouncing.",
    connected: "Front forks, rear shock absorbers, swingarm and wheels."
  },
  exhaust: {
    title: "Exhaust System",
    category: "ENGINE SYSTEM",
    description: "Carries exhaust gases away from the engine and reduces exhaust noise.",
    inspect: "Check for visible damage or loose mounts after the exhaust cools.",
    connected: "Exhaust header, gaskets, muffler and mounting brackets."
  },
  electrical: {
    title: "Electrical System",
    category: "ELECTRICAL",
    description: "Supports starting, ignition, lighting and battery charging.",
    inspect: "With the ignition off, check for loose battery terminals or damaged wiring.",
    connected: "Battery, fuses, starter circuit, lighting and charging system."
  },
  chain: {
    title: "Drive Chain",
    category: "FINAL DRIVE",
    description: "Transfers engine power through the sprockets to the rear wheel.",
    inspect: "With the engine off, check for rust, stiff links and visible damage.",
    connected: "Drive chain, front sprocket, rear sprocket and rear wheel."
  }
};

function part(id) {
  const p = data[id];

  if (!p) return;

  const title = document.getElementById("title");
  const details = document.getElementById("details");

  if (title) title.textContent = p.title;

  if (details) {
    details.replaceChildren();

    const category = document.createElement("div");
    category.className = "spec";
    category.textContent = p.category;

    const description = document.createElement("p");
    description.textContent = p.description;

    const inspect = document.createElement("p");
    const inspectLabel = document.createElement("b");
    inspectLabel.textContent = "What to inspect: ";
    inspect.append(inspectLabel, p.inspect);

    const connected = document.createElement("p");
    const connectedLabel = document.createElement("b");
    connectedLabel.textContent = "Connected components: ";
    connected.append(connectedLabel, p.connected);

    details.append(category, description, inspect, connected);
  }
}

/* Make component markers clickable */
document.querySelectorAll(".hot").forEach(marker => {
  marker.style.cursor = "pointer";

  marker.addEventListener("click", function () {
    const match = this.getAttribute("onclick")?.match(/part\(['"]([^'"]+)['"]\)/);
    if (match) part(match[1]);
  });

  marker.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      this.click();
    }
  });
});

/* Create component selection buttons */
const partButtons = document.getElementById("partbuttons");

if (partButtons) {
  partButtons.replaceChildren();

  Object.keys(data).forEach(id => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "part";
    button.textContent = data[id].title;

    button.addEventListener("click", () => part(id));

    partButtons.appendChild(button);
  });
}

/* Navigation between website sections */
function show(id, button) {
  document.querySelectorAll(".page").forEach(page => {
    page.classList.remove("active");
  });

  const selectedPage = document.getElementById(id);

  if (selectedPage) {
    selectedPage.classList.add("active");
  }

  document.querySelectorAll("nav button").forEach(navButton => {
    navButton.classList.remove("active");
  });

  if (button) button.classList.add("active");
}

/* Display system and assembly information */
function system(title, description) {
  const heading = document.getElementById("systemtitle");
  const content = document.getElementById("systemtext");

  if (heading) heading.textContent = title;
  if (content) content.textContent = description;
}

/* Motorcycle fault finder */
const faults = {
  brake: [
    "STOP RIDING",
    "Possible causes include worn brake pads or shoes, a fluid leak, air in a hydraulic line or a damaged brake component. Arrange a professional inspection."
  ],
  start: [
    "CHECK SAFELY",
    "Possible causes include a weak battery, loose terminals, a starter fault, an ignition problem or a fuel-delivery issue. Check the owner's manual."
  ],
  battery: [
    "INSPECT SOON",
    "Possible causes include an ageing battery, poor connections, a charging-system fault or an electrical drain. Have the battery and charging system tested."
  ],
  noise: [
    "ASSESS BEFORE RIDING",
    "Possible causes include loose exhaust hardware, chain problems, worn bearings or engine faults. Stop riding if you hear a severe knocking or grinding noise."
  ],
  power: [
    "INSPECT SOON",
    "Possible causes include a clogged air filter, fuel-delivery problems, ignition faults, low tyre pressure or overdue servicing."
  ],
  chain: [
    "ENGINE OFF",
    "The chain may be dry, damaged, incorrectly adjusted or paired with worn sprockets. Never inspect or adjust it with the engine running."
  ],
  tyre: [
    "STOP RIDING",
    "Possible causes include a puncture, leaking valve, incorrect pressure or tyre damage. Do not ride on a flat or damaged tyre."
  ],
  hot: [
    "STOP IF OVERHEATING",
    "Possible causes include low oil, excessive load or a mechanical fault. Switch off the engine and let it cool. Never touch hot components."
  ]
};

function diagnose() {
  const symptom = document.getElementById("symptom");
  const result = document.getElementById("result");
  const extra = document.getElementById("extra");

  if (!symptom || !result) return;

  const key = symptom.value;

  if (!key || !faults[key]) {
    result.textContent = "Please choose a symptom first.";
    return;
  }

  const fault = faults[key];
  result.replaceChildren();

  const warning = document.createElement("div");
  warning.className = "warn";

  const heading = document.createElement("b");
  heading.textContent = fault[0];

  const description = document.createElement("p");
  description.textContent = fault[1];

  warning.append(heading, description);

  const notes = document.createElement("p");
  const label = document.createElement("b");
  label.textContent = "Your notes: ";

  notes.append(
    label,
    extra && extra.value.trim()
      ? extra.value.trim()
      : "No extra details supplied."
  );

  const disclaimer = document.createElement("p");
  disclaimer.textContent =
    "These are possible causes, not a confirmed diagnosis. Have safety-critical faults inspected by a qualified mechanic.";

  result.append(warning, notes, disclaimer);
}

/* Show engine information when the page first opens */
part("engine");
</script>
